                    // CSSに height: var(--right-pane-h) !important があるため
                    // CSS変数を更新しないとインラインstyleが!importantで上書きされる
                    rightPane.style.setProperty('--right-pane-h', newRightH + 'px');
                    leftPane.style.setProperty('--left-pane-h', newLeftH + 'px');
                    rightPane.style.height = newRightH + 'px';
                    leftPane.style.height = newLeftH + 'px';
                }

                function onSplitterStart(e) {
                    isDragging = true;
                    startY = e.touches ? e.touches[0].clientY : e.clientY;
                    startRightH = rightPane.offsetHeight;
                    startLeftH = leftPane.offsetHeight;
                    splitter.classList.add('dragging');
                    e.preventDefault();
                }

                function onSplitterMove(e) {
                    if (!isDragging) return;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    // DOM順: right-pane(上) → splitter → left-pane(下)
                    // 指を下に動かすと dy>0 → right-pane拡大・left-pane縮小
                    const dy = clientY - startY;
                    const shellH = shell.offsetHeight - splitter.offsetHeight;
                    const newRightH = Math.max(80, Math.min(startRightH + dy, shellH - 80));
                    const newLeftH = shellH - newRightH;
                    setHeights(newRightH, newLeftH);
                    if (e.cancelable) e.preventDefault();
                }

                function onSplitterEnd() {
                    if (!isDragging) return;
                    isDragging = false;
                    splitter.classList.remove('dragging');
                    fitToScreen();
                }

                splitter.addEventListener('touchstart', onSplitterStart, { passive: false });
                document.addEventListener('touchmove', onSplitterMove, { passive: false });
                document.addEventListener('touchend', onSplitterEnd, { passive: true });
                document.addEventListener('touchcancel', onSplitterEnd, { passive: true });
                splitter.addEventListener('mousedown', onSplitterStart);
                window.addEventListener('mousemove', onSplitterMove);
                window.addEventListener('mouseup', onSplitterEnd);
            }

            // ====== ★ ピンチズーム（iPhone用: プレビューエリアのみ） ======
            function initPinchZoom() {
                const pc = document.getElementById('preview-container');
                if (!pc) return;

                let isPinching = false;
                let pinchStartDist = 0;
                let pinchStartScale = 1;

                function getTouchDist(touches) {
                    const dx = touches[0].clientX - touches[1].clientX;
                    const dy = touches[0].clientY - touches[1].clientY;
                    return Math.sqrt(dx * dx + dy * dy);
                }

                pc.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 2) {
                        isPinching = true;
                        pinchStartDist = getTouchDist(e.touches);
                        pinchStartScale = currentScale;
                        e.preventDefault(); // ページ全体ズームを防止
                    }
                }, { passive: false });

                pc.addEventListener('touchmove', (e) => {
                    if (!isPinching || e.touches.length !== 2) return;
                    e.preventDefault(); // スクロールとページズームを防止

                    const dist = getTouchDist(e.touches);
                    if (pinchStartDist === 0) return;

                    const ratio = dist / pinchStartDist;
                    const newScale = Math.max(0.3, Math.min(pinchStartScale * ratio, 2.0));

                    // 中間2本指の中心点を基準にスクロール位置を調整
                    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    const pcRect = pc.getBoundingClientRect();
                    const relX = (midX - pcRect.left + pc.scrollLeft) / (currentPageSize.w * currentScale);
                    const relY = (midY - pcRect.top + pc.scrollTop) / (currentPageSize.h * currentScale);

                    currentScale = newScale;
                    updateZoomUI();

                    // スケール変更後にスクロール位置を中心に合わせる
                    pc.scrollLeft = relX * currentPageSize.w * currentScale - (midX - pcRect.left);
                    pc.scrollTop = relY * currentPageSize.h * currentScale - (midY - pcRect.top);
                }, { passive: false });

                pc.addEventListener('touchend', (e) => {
                    if (e.touches.length < 2) {
                        isPinching = false;
                    }
                }, { passive: true });

                pc.addEventListener('touchcancel', () => {
                    isPinching = false;
                }, { passive: true });
            }

            // ====== 画像のドラッグ＆リサイズ制御（マウス + タッチ対応） ======
            let isImgDragging = false;
            let isImgResizing = false;
            let currentActiveImg = null;
            let imgStartX, imgStartY, imgStartLeft, imgStartTop, imgStartW, imgStartH;
            // ★ 選択中の画像IDを記憶（再描画後もactiveクラスを復元するため）
            let selectedImageId = null;

            function getPointerPos(e) {
                if (e.touches && e.touches.length > 0)
                    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                if (e.changedTouches && e.changedTouches.length > 0)
                    return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
                return { x: e.clientX, y: e.clientY };
            }

            function initImageEvents() {
                const pc = document.getElementById('preview-container');

                // ウィンドウレベル: ドラッグ中の移動を追御
                function onGlobalMove(e) {
                    if (!isImgDragging && !isImgResizing || !currentActiveImg) return;
                    const pos = getPointerPos(e);
                    const dx = (pos.x - imgStartX) / currentScale;
                    const dy = (pos.y - imgStartY) / currentScale;
                    if (isImgDragging) {
                        currentActiveImg.style.left = `${imgStartLeft + dx}px`;
                        currentActiveImg.style.top = `${imgStartTop + dy}px`;
                    } else if (isImgResizing) {
                        currentActiveImg.style.width = `${Math.max(40, imgStartW + dx)}px`;
                        currentActiveImg.style.height = `${Math.max(40, imgStartH + dy)}px`;
                    }
                    if (e.cancelable) e.preventDefault();
                }

                // ウィンドウレベル: 操作確定
                function onGlobalUp(e) {
                    if (!isImgDragging && !isImgResizing) return;
                    const pos = getPointerPos(e);
                    const movedX = Math.abs(pos.x - imgStartX);
                    const movedY = Math.abs(pos.y - imgStartY);
                    const isTap = movedX < 8 && movedY < 8;

                    if (isTap) {
                        // タップ: state不変、renderImagesのみ呼びactive表示
                        isImgDragging = false;
                        isImgResizing = false;
                        currentActiveImg = null;
                        renderImages();
                        return;
                    }

                    // ドラッグ/リサイズ確定: state更新
                    if (currentActiveImg) {
                        const id = currentActiveImg.dataset.id;
                        const imgData = state.images.find(img => img.id === id);
                        if (imgData) {
                            let newLeft = parseFloat(currentActiveImg.style.left);
                            let newTop = parseFloat(currentActiveImg.style.top);
                            imgData.width = parseFloat(currentActiveImg.style.width);
                            imgData.height = parseFloat(currentActiveImg.style.height);
                            let pg = imgData.page || 0;
                            const ph = currentPageSize.h;
                            if (newTop > ph) { const s = Math.floor(newTop / ph); pg += s; newTop -= ph * s; }
                            else if (newTop < 0 && pg > 0) { const s = Math.ceil(Math.abs(newTop) / ph); pg = Math.max(0, pg - s); newTop += ph * s; }
                            imgData.x = newLeft; imgData.y = newTop; imgData.page = pg;
                        }
                    }
                    isImgDragging = false;
                    isImgResizing = false;
                    currentActiveImg = null;
                    updatePreview();
                }

                // 画像以外のタップで選択解除
                pc.addEventListener('touchstart', (e) => {
                    if (!e.target.closest('.draggable-image-wrapper')) {
                        selectedImageId = null;
                        renderImages();
                    }
                }, { passive: true });
                pc.addEventListener('mousedown', (e) => {
                    if (!e.target.closest('.draggable-image-wrapper')) {
                        selectedImageId = null;
                        renderImages();
                    }
                });

                window.addEventListener('mousemove', onGlobalMove);
                window.addEventListener('mouseup', onGlobalUp);
                window.addEventListener('touchmove', onGlobalMove, { passive: false });
                window.addEventListener('touchend', onGlobalUp);
            }

            function handleImageUpload(e) {
                const files = e.target.files;
                if (!files.length) return;
                Array.from(files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = function (evt) {
                        const base64 = evt.target.result;
                        const tempImg = new Image();
                        tempImg.onload = function () {
                            const ratio = tempImg.width / tempImg.height;
                            const initW = 250;
                            const initH = 250 / ratio;
                            state.images.push({
                                id: 'img_' + Date.now() + Math.random().toString(36).substr(2, 5),
                                base64: base64,
                                x: 100, y: 150,
                                width: initW, height: initH,
                                page: 0,
                                rotation: 0
                            });
                            updatePreview();
                        };
                        tempImg.src = base64;
                    };
                    reader.readAsDataURL(file);
                });
                e.target.value = '';
            }

            function renderImages() {
                const totalPages = document.querySelectorAll('.pdf-page').length;
                document.querySelectorAll('.pdf-page').forEach(page => {
                    let imgLayer = page.querySelector('.img-layer');
                    if (!imgLayer) {
                        imgLayer = document.createElement('div');
                        imgLayer.className = 'img-layer absolute inset-0 z-40 pointer-events-none';
                        page.appendChild(imgLayer);
                    }
                    imgLayer.innerHTML = '';
                });

                state.images.forEach(imgData => {
                    const pageIndex = Math.min(imgData.page || 0, totalPages - 1);
                    const targetPage = document.querySelector(`.pdf-page[data-page="${pageIndex}"]`);
                    if (!targetPage) return;
                    const imgLayer = targetPage.querySelector('.img-layer');

                    // ★ wrapper
                    const wrapper = document.createElement('div');
                    wrapper.className = 'draggable-image-wrapper pointer-events-auto' +
                        (imgData.id === selectedImageId ? ' active' : '');
                    wrapper.dataset.id = imgData.id;
                    wrapper.style.cssText =
                        `left:${imgData.x}px;top:${imgData.y}px;` +
                        `width:${imgData.width}px;height:${imgData.height}px;touch-action:none;`;

                    // 画像本体
                    const img = document.createElement('img');
                    img.src = imgData.base64;
                    const rot = imgData.rotation || 0;
                    img.style.cssText = 'width:100%;height:100%;object-fit:contain;' +
                        `transform:rotate(${rot}deg);` +
                        'pointer-events:none;user-select:none;-webkit-user-drag:none;display:block;';

                    // ★ 削除ボタン — 直接イベント登録（iPhoneでのイベントデリゲート不具合回避）
                    const deleteBtn = document.createElement('div');
                    deleteBtn.className = 'delete-btn-img';
                    function doDelete(e) {
                        e.stopPropagation();
                        if (e.cancelable) e.preventDefault();
                        isImgDragging = false; isImgResizing = false; currentActiveImg = null;
                        selectedImageId = null;
                        state.images = state.images.filter(img => img.id !== imgData.id);
                        updatePreview();
                    }
                    deleteBtn.addEventListener('touchstart', doDelete, { passive: false });
                    deleteBtn.addEventListener('mousedown', doDelete);

                    // ★ リサイズハンドル — 直接イベント登録
                    const resizeHandle = document.createElement('div');
                    resizeHandle.className = 'resize-handle-img';
                    function onResizeStart(e) {
                        e.stopPropagation();
                        if (e.cancelable) e.preventDefault();
                        isImgResizing = true; isImgDragging = false;
                        currentActiveImg = wrapper;
                        selectedImageId = imgData.id;
                        const pos = getPointerPos(e);
                        imgStartX = pos.x; imgStartY = pos.y;
                        imgStartW = parseFloat(wrapper.style.width);
                        imgStartH = parseFloat(wrapper.style.height);
                    }
                    resizeHandle.addEventListener('touchstart', onResizeStart, { passive: false });
                    resizeHandle.addEventListener('mousedown', onResizeStart);

                    // ★ ラッパードラッグ — 直接イベント登録
                    function onWrapperStart(e) {
                        if (e.target.closest('.delete-btn-img') || e.target.closest('.resize-handle-img')) return;
                        e.stopPropagation();
                        if (e.cancelable) e.preventDefault();
                        isImgDragging = true; isImgResizing = false;
                        currentActiveImg = wrapper;
                        selectedImageId = imgData.id;
                        const pos = getPointerPos(e);
                        imgStartX = pos.x; imgStartY = pos.y;
                        imgStartLeft = parseFloat(wrapper.style.left);
                        imgStartTop = parseFloat(wrapper.style.top);
                    }
                    wrapper.addEventListener('touchstart', onWrapperStart, { passive: false });
                    wrapper.addEventListener('mousedown', onWrapperStart);

                    // ★ 回転ボタン — クリックでスライダーコントロールをトグル
                    const rotateBtn = document.createElement('div');
                    rotateBtn.className = 'rotate-btn-img';

                    // スライダーラッパー（初期非表示）
                    const sliderWrap = document.createElement('div');
                    sliderWrap.className = 'rotate-slider-wrap';
                    const initRotation = imgData.rotation || 0;
                    sliderWrap.innerHTML = `
                        <label>回転角</label>
                        <input type="range" min="-180" max="180" step="1" value="${initRotation}" class="img-rotate-slider">
                        <span class="rotate-val">${initRotation}°</span>
                        <button class="rotate-reset-btn" title="リセット" style="font-size:14px;background:none;border:none;cursor:pointer;color:#94a3b8;padding:0 2px;line-height:1;" type="button">↺</button>
                    `;
                    const slider = sliderWrap.querySelector('.img-rotate-slider');
                    const rotateVal = sliderWrap.querySelector('.rotate-val');
                    const resetBtn = sliderWrap.querySelector('.rotate-reset-btn');
                    slider.addEventListener('input', () => {
                        const deg = parseInt(slider.value);
                        rotateVal.textContent = deg + '°';
                        imgData.rotation = deg;
                        img.style.transform = `rotate(${deg}deg)`;
                    });
                    slider.addEventListener('change', () => {
                        updatePreview();
                    });
                    // リセットボタン
                    if (resetBtn) {
                        resetBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            imgData.rotation = 0;
                            slider.value = 0;
                            rotateVal.textContent = '0°';
                            img.style.transform = 'rotate(0deg)';
                            updatePreview();
                        });
                        resetBtn.addEventListener('touchstart', (e) => {
                            e.stopPropagation();
                            e.preventDefault();
                            imgData.rotation = 0;
                            slider.value = 0;
                            rotateVal.textContent = '0°';
                            img.style.transform = 'rotate(0deg)';
                            updatePreview();
                        }, { passive: false });
                    }

                    function doRotate(e) {
                        e.stopPropagation();
                        if (e.cancelable) e.preventDefault();
                        isImgDragging = false; isImgResizing = false; currentActiveImg = null;
                        selectedImageId = imgData.id;
                        // スライダーの表示/非表示トグル
                        sliderWrap.classList.toggle('visible');
                    }
                    rotateBtn.addEventListener('touchstart', doRotate, { passive: false });
                    rotateBtn.addEventListener('mousedown', doRotate);

                    wrapper.appendChild(img);
                    wrapper.appendChild(resizeHandle);
                    wrapper.appendChild(deleteBtn);
                    wrapper.appendChild(rotateBtn);
                    imgLayer.appendChild(wrapper);
                    // スライダーは画像wrapperの親の直后に追加（img-layerの外側に出せないため『pdf-pageに追加）
                    // 同じ pdf-page 内に position:absolute で配置
                    sliderWrap.style.cssText = `position:absolute;bottom:0;left:0;right:0;z-index:50;margin:0 8px 8px;`;
                    targetPage.appendChild(sliderWrap);
                    // スライダーが表示中に選択画像が切り替わったら非表示
                    wrapper.addEventListener('mousedown', () => sliderWrap.classList.remove('visible'));
                    wrapper.addEventListener('touchstart', () => sliderWrap.classList.remove('visible'), { passive: true });
                });
                // lucide不要（ボタンはCSSデコレーターで表示）
            }

            // ====== 図形挿入・編集・削除ロジック ======
            let selectedShapeId = null;
            let isShapeDragging = false;
            let isShapeResizing = false;
            let currentActiveShape = null;
            let shapeStartX, shapeStartY, shapeStartLeft, shapeStartTop, shapeStartW, shapeStartH;

            function initShapeEvents() {
                // 図形挿入ボタンのクリック
                document.querySelectorAll('.shape-insert-btn[data-shape]').forEach(btn => {
                    btn.addEventListener('click', () => insertShape(btn.dataset.shape));
                    btn.addEventListener('touchend', (e) => { e.preventDefault(); insertShape(btn.dataset.shape); }, { passive: false });
                });

                // 左パネルのスタイル変更 → 選択中図形にリアルタイム反映
                document.getElementById('shape-fill-color').addEventListener('input', () => {
                    if (!selectedShapeId) return;
                    const s = state.shapes.find(s => s.id === selectedShapeId);
                    if (s) { s.fillColor = document.getElementById('shape-fill-color').value; s.noFill = false; renderShapes(); }
                });
                document.getElementById('shape-stroke-color').addEventListener('input', () => {
                    if (!selectedShapeId) return;
                    const s = state.shapes.find(s => s.id === selectedShapeId);
                    if (s) { s.strokeColor = document.getElementById('shape-stroke-color').value; renderShapes(); }
                });
                document.getElementById('shape-stroke-width').addEventListener('change', () => {
                    if (!selectedShapeId) return;
                    const s = state.shapes.find(s => s.id === selectedShapeId);
                    if (s) { s.strokeWidth = parseInt(document.getElementById('shape-stroke-width').value); renderShapes(); }
                });
                document.getElementById('shape-opacity').addEventListener('change', () => {
                    if (!selectedShapeId) return;
                    const s = state.shapes.find(s => s.id === selectedShapeId);
                    if (s) { s.opacity = parseFloat(document.getElementById('shape-opacity').value); renderShapes(); }
                });

                // ウィンドウレベル: 図形ドラッグ/リサイズ移動追跡
                function onGlobalShapeMove(e) {
                    if (!isShapeDragging && !isShapeResizing || !currentActiveShape) return;
                    const pos = getPointerPos(e);
                    const dx = (pos.x - shapeStartX) / currentScale;
                    const dy = (pos.y - shapeStartY) / currentScale;
                    if (isShapeDragging) {
                        currentActiveShape.style.left = `${shapeStartLeft + dx}px`;
                        currentActiveShape.style.top = `${shapeStartTop + dy}px`;
                    } else if (isShapeResizing) {
                        currentActiveShape.style.width = `${Math.max(20, shapeStartW + dx)}px`;
                        currentActiveShape.style.height = `${Math.max(20, shapeStartH + dy)}px`;
                    }
                    if (e.cancelable) e.preventDefault();
                }

                function onGlobalShapeUp(e) {
                    if (!isShapeDragging && !isShapeResizing) return;
                    const pos = getPointerPos(e);
                    const movedX = Math.abs(pos.x - shapeStartX);
                    const movedY = Math.abs(pos.y - shapeStartY);
                    const isTap = movedX < 8 && movedY < 8;

                    if (currentActiveShape && !isTap) {
                        const id = currentActiveShape.dataset.shapeId;
                        const sd = state.shapes.find(s => s.id === id);
                        if (sd) {
                            let newLeft = parseFloat(currentActiveShape.style.left);
                            let newTop = parseFloat(currentActiveShape.style.top);
                            sd.width = parseFloat(currentActiveShape.style.width);
                            sd.height = parseFloat(currentActiveShape.style.height);
                            let pg = sd.page || 0;
                            const ph = currentPageSize.h;
                            if (newTop > ph) { const s = Math.floor(newTop / ph); pg += s; newTop -= ph * s; }
                            else if (newTop < 0 && pg > 0) { const s = Math.ceil(Math.abs(newTop) / ph); pg = Math.max(0, pg - s); newTop += ph * s; }
                            sd.x = newLeft; sd.y = newTop; sd.page = pg;
                        }
                        updatePreview();
                    }
                    isShapeDragging = false;
                    isShapeResizing = false;
                    currentActiveShape = null;
                }

                window.addEventListener('mousemove', onGlobalShapeMove);
                window.addEventListener('mouseup', onGlobalShapeUp);
                window.addEventListener('touchmove', onGlobalShapeMove, { passive: false });
                window.addEventListener('touchend', onGlobalShapeUp);

                // プレビュー外クリックで図形選択解除
                const pc = document.getElementById('preview-container');
                pc.addEventListener('mousedown', (e) => {
                    if (!e.target.closest('.draggable-shape-wrapper')) {
                        selectedShapeId = null;
                        renderShapes();
                    }
                });
                pc.addEventListener('touchstart', (e) => {
                    if (!e.target.closest('.draggable-shape-wrapper')) {
                        selectedShapeId = null;
                        renderShapes();
                    }
                }, { passive: true });
            }

            function insertShape(type) {
                const fillC = document.getElementById('shape-fill-color').value || '#4A90D9';
                const strokeC = document.getElementById('shape-stroke-color').value || '#1e293b';
                const strokeW = parseInt(document.getElementById('shape-stroke-width').value);
                const opacity = parseFloat(document.getElementById('shape-opacity').value);
                const isLine = (type === 'line' || type === 'arrow');
                const newShape = {
                    id: 'shape_' + Date.now() + Math.random().toString(36).substr(2, 5),
                    type: type,
                    x: 150, y: 200,
                    width: isLine ? 200 : 150,
                    height: isLine ? 40 : 100,
                    page: 0,
                    fillColor: fillC,
                    strokeColor: strokeC,
                    strokeWidth: isNaN(strokeW) ? 2 : strokeW,
                    opacity: isNaN(opacity) ? 1 : opacity,
                    noFill: false
                };
                if (!state.shapes) state.shapes = [];
                state.shapes.push(newShape);
                selectedShapeId = newShape.id;
                renderShapes();
                showNotification(type + ' を挿入しました', 'success');
            }

            function buildSVGShape(type, w, h, fillColor, strokeColor, strokeWidth, noFill) {
                const fill = noFill ? 'none' : fillColor;
                const sw = strokeWidth;
                const stroke = sw > 0 ? strokeColor : 'none';
                const vb = `0 0 ${w} ${h}`;
                let inner = '';
                if (type === 'rect') {
                    inner = `<rect x="${sw / 2}" y="${sw / 2}" width="${w - sw}" height="${h - sw}" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
                } else if (type === 'circle') {
                    const cx = w / 2, cy = h / 2, rx = (w - sw) / 2, ry = (h - sw) / 2;
                    inner = `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
                } else if (type === 'triangle') {
                    const pts = `${w / 2},${sw} ${w - sw},${h - sw} ${sw},${h - sw}`;
                    inner = `<polygon points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
                } else if (type === 'diamond') {
                    const pts = `${w / 2},${sw} ${w - sw},${h / 2} ${w / 2},${h - sw} ${sw},${h / 2}`;
                    inner = `<polygon points="${pts}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
                } else if (type === 'star') {
                    const cx2 = w / 2, cy2 = h / 2;
                    const R = Math.min(w, h) / 2 - sw, r = R * 0.45;
                    let pts2 = '';
                    for (let i = 0; i < 10; i++) { const a = Math.PI / 5 * i - Math.PI / 2; const ri = i % 2 === 0 ? R : r; pts2 += `${cx2 + ri * Math.cos(a)},${cy2 + ri * Math.sin(a)} `; }
                    inner = `<polygon points="${pts2.trim()}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
                } else if (type === 'line') {
                    inner = `<line x1="${sw}" y1="${h / 2}" x2="${w - sw}" y2="${h / 2}" stroke="${strokeColor}" stroke-width="${sw || 2}" stroke-linecap="round"/>`;
                } else if (type === 'arrow') {
                    const aw = Math.min(20, w * 0.2), ah = Math.min(12, h * 0.4);
                    inner = `<line x1="${sw}" y1="${h / 2}" x2="${w - aw - sw}" y2="${h / 2}" stroke="${strokeColor}" stroke-width="${sw || 2}" stroke-linecap="round"/>
                    <polygon points="${w - aw - sw},${h / 2 - ah} ${w - sw},${h / 2} ${w - aw - sw},${h / 2 + ah}" fill="${strokeColor}" stroke="none"/>`;
                } else if (type === 'callout') {
                    const r2 = 6, tw = h * 0.3, tx = w * 0.15;
                    inner = `<path d="M${r2},${sw} H${w - r2 - sw} Q${w - sw},${sw} ${w - sw},${r2 + sw} V${h * 0.7} Q${w - sw},${h * 0.7 + r2} ${w - r2 - sw},${h * 0.7 + r2} H${tx + tw} L${tx},${h - sw} L${tx + tw * 0.4},${h * 0.7 + r2} H${r2} Q${sw},${h * 0.7 + r2} ${sw},${h * 0.7} V${r2 + sw} Q${sw},${sw} ${r2},${sw} Z" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;
                }
                return `<svg viewBox="${vb}" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="display:block;">${inner}</svg>`;
            }

            function renderShapes() {
                // 既存の shape-layer を全クリア
                document.querySelectorAll('.shape-layer').forEach(l => l.innerHTML = '');
                // shape-layer が存在しないページに作成
                document.querySelectorAll('.pdf-page').forEach(page => {
                    let sl = page.querySelector('.shape-layer');
                    if (!sl) {
                        sl = document.createElement('div');
                        sl.className = 'shape-layer absolute inset-0 z-42 pointer-events-none';
                        page.insertBefore(sl, page.querySelector('.img-layer') || page.firstChild);
                    }
                    sl.innerHTML = '';
                });

                if (!state.shapes) return;
                const totalPages = document.querySelectorAll('.pdf-page').length;

                state.shapes.forEach(sd => {
                    const pageIndex = Math.min(sd.page || 0, totalPages - 1);
                    const targetPage = document.querySelector(`.pdf-page[data-page="${pageIndex}"]`);
                    if (!targetPage) return;
                    let sl = targetPage.querySelector('.shape-layer');
                    if (!sl) return;

                    const wrapper = document.createElement('div');
                    wrapper.className = 'draggable-shape-wrapper pointer-events-auto' +
                        (sd.id === selectedShapeId ? ' active' : '');
                    wrapper.dataset.shapeId = sd.id;
                    wrapper.style.cssText =
                        `position:absolute;left:${sd.x}px;top:${sd.y}px;` +
                        `width:${sd.width}px;height:${sd.height}px;` +
                        `opacity:${sd.opacity};touch-action:none;cursor:move;user-select:none;`;

                    // SVG本体
                    const svgDiv = document.createElement('div');
                    svgDiv.style.cssText = 'width:100%;height:100%;pointer-events:none;';
                    svgDiv.innerHTML = buildSVGShape(sd.type, sd.width, sd.height, sd.fillColor, sd.strokeColor, sd.strokeWidth, sd.noFill);

                    // 削除ボタン
                    const delBtn = document.createElement('div');
                    delBtn.className = 'shape-delete-btn';
                    delBtn.innerHTML = '✕';
                    const isMobile = window.innerWidth < 768;
                    const dBtnSize = isMobile ? '36px' : '20px';
                    const dBtnOffset = isMobile ? '-16px' : '-10px';
                    const dBtnFontSize = isMobile ? '15px' : '11px';
                    delBtn.style.cssText = `position:absolute;top:${dBtnOffset};right:${dBtnOffset};width:${dBtnSize};height:${dBtnSize};border-radius:50%;` +
                        `background:#ef4444;color:white;border:2.5px solid white;cursor:pointer;font-size:${dBtnFontSize};font-weight:bold;` +
                        'display:' + (sd.id === selectedShapeId ? 'flex' : 'none') + ';align-items:center;justify-content:center;' +
                        'box-shadow:0 2px 6px rgba(0,0,0,0.3);z-index:56;touch-action:manipulation;';
                    function doShapeDelete(e) {
                        e.stopPropagation();
                        if (e.cancelable) e.preventDefault();
                        isShapeDragging = false; isShapeResizing = false; currentActiveShape = null;
                        selectedShapeId = null;
                        state.shapes = state.shapes.filter(x => x.id !== sd.id);
                        renderShapes();
                    }
                    delBtn.addEventListener('touchstart', doShapeDelete, { passive: false });
                    delBtn.addEventListener('mousedown', doShapeDelete);

                    // リサイズハンドル
                    const resizeH = document.createElement('div');
                    const rHandleSize = isMobile ? '22px' : '14px';
                    const rHandleOffset = isMobile ? '-8px' : '-6px';
                    resizeH.style.cssText = `position:absolute;bottom:${rHandleOffset};right:${rHandleOffset};width:${rHandleSize};height:${rHandleSize};` +
                        `background:#1A73E8;border:2px solid white;border-radius:50%;cursor:se-resize;z-index:55;` +
                        'display:' + (sd.id === selectedShapeId ? 'block' : 'none') + ';touch-action:none;';
                    function onShapeResizeStart(e) {
                        e.stopPropagation();
                        if (e.cancelable) e.preventDefault();
                        isShapeResizing = true; isShapeDragging = false;
                        currentActiveShape = wrapper;
                        selectedShapeId = sd.id;
                        const pos = getPointerPos(e);
                        shapeStartX = pos.x; shapeStartY = pos.y;
                        shapeStartW = parseFloat(wrapper.style.width);
                        shapeStartH = parseFloat(wrapper.style.height);
                    }
                    resizeH.addEventListener('touchstart', onShapeResizeStart, { passive: false });
                    resizeH.addEventListener('mousedown', onShapeResizeStart);

                    // ラッパードラッグ (移動 + 選択)
                    function onShapeWrapperStart(e) {
                        if (e.target.closest('.shape-delete-btn') || e.target === resizeH) return;
                        e.stopPropagation();
                        if (e.cancelable) e.preventDefault();
                        isShapeDragging = true; isShapeResizing = false;
                        currentActiveShape = wrapper;
                        selectedShapeId = sd.id;
                        const pos = getPointerPos(e);
                        shapeStartX = pos.x; shapeStartY = pos.y;
                        shapeStartLeft = parseFloat(wrapper.style.left);
                        shapeStartTop = parseFloat(wrapper.style.top);
                        // 選択状態を即反映
                        document.querySelectorAll('.draggable-shape-wrapper').forEach(w => {
                            w.classList.remove('active');
                            w.querySelector('.shape-delete-btn') && (w.querySelector('.shape-delete-btn').style.display = 'none');
                            w.querySelectorAll('[data-resize]').forEach(h => h.style.display = 'none');
                        });
                        wrapper.classList.add('active');
                        delBtn.style.display = 'flex';
                        resizeH.style.display = 'block';
                        // 左パネルのコントロールを選択図形の値に同期
                        syncShapeControlsToSelected(sd);
                        // モバイルでは編集ポップアップ経由、PCは即表示
                        if (e.type === 'touchstart' && window.innerWidth < 768) {
                            showMobileEditPopup(wrapper, () => openShapeEditor(sd, wrapper));
                        } else {
                            openShapeEditor(sd, wrapper);
                        }
                    }
                    wrapper.addEventListener('touchstart', onShapeWrapperStart, { passive: false });
                    wrapper.addEventListener('mousedown', onShapeWrapperStart);

                    wrapper.appendChild(svgDiv);
                    wrapper.appendChild(delBtn);
                    wrapper.appendChild(resizeH);
                    sl.appendChild(wrapper);
                });
            }

            function syncShapeControlsToSelected(sd) {
                const fc = document.getElementById('shape-fill-color');
                const sc = document.getElementById('shape-stroke-color');
                const sw = document.getElementById('shape-stroke-width');
                const op = document.getElementById('shape-opacity');
                if (fc && !sd.noFill) fc.value = sd.fillColor || '#4A90D9';
                if (sc) sc.value = sd.strokeColor || '#1e293b';
                if (sw) sw.value = String(sd.strokeWidth ?? 2);
                if (op) op.value = String(sd.opacity ?? 1);
            }

            // 図形用フローティング編集パネル
            let _shapeEditorPanel = null;
            function openShapeEditor(sd, anchorEl) {
                // 既存パネルを削除
                if (_shapeEditorPanel) { _shapeEditorPanel.remove(); _shapeEditorPanel = null; }

                const panel = document.createElement('div');
                panel.className = 'shape-editor-panel';
                panel.style.cssText = 'position:fixed;z-index:9100;background:white;border-radius:14px;' +
                    'box-shadow:0 8px 32px rgba(0,0,0,0.18),0 2px 8px rgba(0,0,0,0.10);' +
                    'padding:12px 14px;min-width:240px;border:1px solid #e2e8f0;' +
                    'display:flex;flex-direction:column;gap:8px;';

                const noFillChecked = sd.noFill ? 'checked' : '';
                panel.innerHTML = `
                    <div style="display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:900;color:#1e293b;border-bottom:1px solid #f1f5f9;padding-bottom:8px;">
                        <span>図形スタイル編集</span>
                        <span id="shape-panel-close" style="cursor:pointer;color:#94a3b8;font-size:16px;padding:2px 4px;border-radius:4px;">✕</span>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
                        <span style="font-size:10px;font-weight:700;color:#64748b;width:50px;">塗り色</span>
                        <input type="color" id="sp-fill" value="${sd.noFill ? '#ffffff' : (sd.fillColor || '#4A90D9')}" style="width:28px;height:22px;border:1px solid #cbd5e1;border-radius:5px;padding:1px;cursor:pointer;">
                        <label style="display:flex;align-items:center;gap:3px;font-size:10px;color:#64748b;cursor:pointer;">
                            <input type="checkbox" id="sp-nofill" ${noFillChecked} style="width:12px;height:12px;"> 塗りなし
                        </label>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;">
                        <span style="font-size:10px;font-weight:700;color:#64748b;width:50px;">枠線色</span>
                        <input type="color" id="sp-stroke" value="${sd.strokeColor || '#1e293b'}" style="width:28px;height:22px;border:1px solid #cbd5e1;border-radius:5px;padding:1px;cursor:pointer;">
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;">
                        <span style="font-size:10px;font-weight:700;color:#64748b;width:50px;">線幅</span>
                        <select id="sp-sw" style="font-size:10px;border:1px solid #e2e8f0;border-radius:5px;padding:2px 4px;background:white;">
                            <option value="0"${sd.strokeWidth === 0 ? ' selected' : ''}>なし</option>
                            <option value="1"${sd.strokeWidth === 1 ? ' selected' : ''}>細</option>
                            <option value="2"${(sd.strokeWidth ?? 2) === 2 ? ' selected' : ''}>普通</option>
                            <option value="4"${sd.strokeWidth === 4 ? ' selected' : ''}>太</option>
                        </select>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;">
                        <span style="font-size:10px;font-weight:700;color:#64748b;width:50px;">透明度</span>
                        <select id="sp-op" style="font-size:10px;border:1px solid #e2e8f0;border-radius:5px;padding:2px 4px;background:white;">
                            <option value="1"${(sd.opacity ?? 1) >= 1 ? ' selected' : ''}>100%</option>
                            <option value="0.75"${sd.opacity === 0.75 ? ' selected' : ''}>75%</option>
                            <option value="0.5"${sd.opacity === 0.5 ? ' selected' : ''}>50%</option>
                            <option value="0.25"${sd.opacity === 0.25 ? ' selected' : ''}>25%</option>
                        </select>
                    </div>`;

                document.body.appendChild(panel);
                _shapeEditorPanel = panel;

                // 位置調整
                const rect = anchorEl.getBoundingClientRect();
                const pw2 = panel.offsetWidth || 260, ph2 = panel.offsetHeight || 220;
                let top, left;

                if (window.innerWidth >= 768) {
                    // PC: PDFページ（様式）の左外側・プレビュー領域内に配置
                    const pdfPage = document.querySelector('.capture-area-container') || document.querySelector('.pdf-page');
                    const pc = document.getElementById('preview-container');
                    if (pdfPage && pc) {
                        const pageRect = pdfPage.getBoundingClientRect();
                        const pcRect = pc.getBoundingClientRect();
                        // PDFページ左端のさらに左に配置（余白がなければプレビュー左端）
                        left = Math.max(pcRect.left + 6, pageRect.left - pw2 - 10);
                        // 縦はアンカー要素の高さに合わせて表示（画面内に収める）
                        top = Math.min(Math.max(rect.top, pcRect.top + 8), window.innerHeight - ph2 - 8);

                        // テキスト編集パネルが表示中なら重ならないよう縦に並べる
                        const fse = document.getElementById('floating-style-editor');
                        if (fse && fse.classList.contains('visible')) {
                            const fr = fse.getBoundingClientRect();
                            if (top < fr.bottom + 6 && top + ph2 > fr.top - 6) {
                                top = fr.bottom + 8;
                                if (top + ph2 > window.innerHeight - 8) {
                                    top = fr.top - ph2 - 8;
                                }
                            }
                        }
                    } else {
                        // フォールバック: 左端寄せ
                        left = 8;
                        top = Math.min(rect.top, window.innerHeight - ph2 - 8);
                    }
                } else {
                    // モバイル: 従来通りアンカー要素の下に表示
                    top = rect.bottom + 8;
                    left = rect.left;
                    if (left + pw2 > window.innerWidth - 8) left = window.innerWidth - pw2 - 8;
                    if (left < 8) left = 8;
                    if (top + ph2 > window.innerHeight - 8) top = rect.top - ph2 - 8;
                }
                panel.style.left = left + 'px'; panel.style.top = top + 'px';

                // パネル位置を再計算する共通関数（レンダリング後にDOMが更新されるため再居履が必要）
                function positionShapePanel() {
                    const pw3 = panel.offsetWidth || 260, ph3 = panel.offsetHeight || 220;
                    if (window.innerWidth >= 768) {
                        const pdfPage3 = document.querySelector('.capture-area-container') || document.querySelector('.pdf-page');
                        const pc3 = document.getElementById('preview-container');
                        if (pdfPage3 && pc3) {
                            const pageRect3 = pdfPage3.getBoundingClientRect();
                            const pcRect3 = pc3.getBoundingClientRect();
                            let l3 = Math.max(pcRect3.left + 6, pageRect3.left - pw3 - 10);
                            let t3 = Math.min(Math.max(parseFloat(panel.style.top) || pcRect3.top + 8, pcRect3.top + 8), window.innerHeight - ph3 - 8);
                            panel.style.left = l3 + 'px'; panel.style.top = t3 + 'px';
                        }
                    }
                }

                // イベント
                panel.querySelector('#shape-panel-close').addEventListener('click', () => { panel.remove(); _shapeEditorPanel = null; });
                panel.querySelector('#sp-fill').addEventListener('input', (e) => {
                    sd.fillColor = e.target.value; sd.noFill = false;
                    panel.querySelector('#sp-nofill').checked = false;
                    document.getElementById('shape-fill-color').value = e.target.value;
                    renderShapes();
                    positionShapePanel();
                });
                panel.querySelector('#sp-nofill').addEventListener('change', (e) => {
                    sd.noFill = e.target.checked;
                    renderShapes();
                    const w2 = document.querySelector(`.draggable-shape-wrapper[data-shape-id="${sd.id}"]`);
                    if (w2) openShapeEditor(sd, w2);
                });
                panel.querySelector('#sp-stroke').addEventListener('input', (e) => {
                    sd.strokeColor = e.target.value;
                    document.getElementById('shape-stroke-color').value = e.target.value;
                    renderShapes();
                    positionShapePanel();
                });
                panel.querySelector('#sp-sw').addEventListener('change', (e) => {
                    sd.strokeWidth = parseInt(e.target.value);
                    document.getElementById('shape-stroke-width').value = e.target.value;
                    renderShapes();
                    const w2 = document.querySelector(`.draggable-shape-wrapper[data-shape-id="${sd.id}"]`);
                    if (w2) openShapeEditor(sd, w2);
                });
                panel.querySelector('#sp-op').addEventListener('change', (e) => {
                    sd.opacity = parseFloat(e.target.value);
                    document.getElementById('shape-opacity').value = e.target.value;
                    renderShapes();
                    positionShapePanel();
                });

                // パネル外クリックで閉じる
                setTimeout(() => {
                    function onOutsideClick(e) {
                        if (!panel.contains(e.target) && !e.target.closest('.draggable-shape-wrapper')) {
                            panel.remove(); _shapeEditorPanel = null;
                            document.removeEventListener('mousedown', onOutsideClick);
                            document.removeEventListener('touchstart', onOutsideClick);
                        }
                    }
                    document.addEventListener('mousedown', onOutsideClick);
                    document.addEventListener('touchstart', onOutsideClick, { passive: true });
                }, 100);
            }

            // ====== プレビュークリック/タッチでスタイル編集パネルを表示 ======
            let _fseCurrentTarget = null;

            function initFloatingStyleEditor() {
                // フローティングパネル DOMを発行
                if (document.getElementById('floating-style-editor')) return;
                const panel = document.createElement('div');
                panel.id = 'floating-style-editor';
                panel.innerHTML = `
                    <div class="fse-header">
                        <span id="fse-title">スタイル編集</span>
                        <span class="fse-close" id="fse-close">✕</span>
                    </div>
                    <div id="fse-body"></div>`;
                document.body.appendChild(panel);
                document.getElementById('fse-close').addEventListener('click', closeFloatingEditor);
                document.addEventListener('click', (e) => {
                    if (!panel.contains(e.target) && !e.target.closest('[data-clickable-style]')) {
                        closeFloatingEditor();
                    }
                });
                document.addEventListener('touchstart', (e) => {
                    if (!panel.contains(e.target) && !e.target.closest('[data-clickable-style]')) {
                        closeFloatingEditor();
                    }
                }, { passive: true });
            }

            function openFloatingEditor(panelId, label, styleObj, anchorEl) {
                initFloatingStyleEditor();
                _fseCurrentTarget = panelId;
                const showFont = (panelId === 'title' || panelId.startsWith('heading_'));
                const showAlign = (panelId === 'title' || panelId === 'date' || panelId.startsWith('heading_') || panelId.startsWith('content_'));
                const body = document.getElementById('fse-body');
                document.getElementById('fse-title').textContent = label + ' スタイル編集';
                body.innerHTML = buildStylePanelInner(panelId, styleObj, { showFont, showAlign });
                attachStylePanelEvents(body);
                // パネルを開く
                const sBody = body.querySelector('[data-panel-body]');
                if (sBody) sBody.classList.add('open');

                const panel = document.getElementById('floating-style-editor');
                panel.classList.add('visible');
                positionFloatingEditor(anchorEl);
            }

            function buildStylePanelInner(id, styleObj, opts = {}) {
                const { showFont = true, showAlign = false } = opts;
                const sizeOptions = [
                    { v: 'xs', t: '極小' }, { v: 'sm', t: '小' }, { v: 'base', t: '標準' },
                    { v: 'lg', t: '大' }, { v: 'xl', t: '特大' }, { v: '2xl', t: '極大' }
                ];
                const weightOptions = [
                    { v: '300', t: '細' }, { v: '400', t: '普通' }, { v: '500', t: '中' },
                    { v: '700', t: '太' }, { v: '900', t: '極太' }
                ];
                const sizeBtns = sizeOptions.map(o =>
                    `<button class="style-btn${styleObj.size === o.v ? ' active' : ''}" data-panel="${id}" data-prop="size" data-val="${o.v}">${o.t}</button>`
                ).join('');
                const weightBtns = weightOptions.map(o =>
                    `<button class="style-btn${styleObj.weight === o.v ? ' active' : ''}" data-panel="${id}" data-prop="weight" data-val="${o.v}">${o.t}</button>`
                ).join('');
                const fontBtns = !showFont ? '' : Object.entries(FONT_LABEL).map(([v, t]) =>
                    `<button class="style-btn${styleObj.font === v ? ' active' : ''}" data-panel="${id}" data-prop="font" data-val="${v}">${t}</button>`
                ).join('');
                const alignBtns = !showAlign ? '' : ALIGN_BTNS.map(o =>
                    `<button class="style-btn${(styleObj.align || 'left') === o.v ? ' active' : ''}" data-panel="${id}" data-prop="align" data-val="${o.v}" title="${o.t}">${o.icon}</button>`
                ).join('');
                return `<div class="style-panel-body open" data-panel-body="${id}" style="padding-top:0;">
                    <div class="style-row">
                        <span class="style-label">色</span>
                        <input type="color" class="style-color-input" data-panel="${id}" data-prop="color" value="${styleObj.color}">
                        <span style="font-size:10px;color:#94a3b8;">${styleObj.color}</span>
                    </div>
                    <div class="style-row"><span class="style-label">サイズ</span><div class="style-btn-group">${sizeBtns}</div></div>
                    <div class="style-row"><span class="style-label">太さ</span><div class="style-btn-group">${weightBtns}</div></div>
                    ${showFont ? `<div class="style-row"><span class="style-label">書体</span><div class="style-btn-group">${fontBtns}</div></div>` : ''}
                    ${showAlign ? `<div class="style-row"><span class="style-label">揃え</span><div class="style-btn-group">${alignBtns}</div></div>` : ''}
                </div>`;
            }

            function positionFloatingEditor(anchorEl) {
                const panel = document.getElementById('floating-style-editor');
                if (!panel || !anchorEl) return;
                const rect = anchorEl.getBoundingClientRect();
                const pw = panel.offsetWidth || 300;
                const ph = panel.offsetHeight || 220;
                let top, left;

                if (window.innerWidth >= 768) {
                    // PC: PDFページ（様式）の左外側に配置
                    const pdfPage = document.querySelector('.capture-area-container') || document.querySelector('.pdf-page');
                    const pc = document.getElementById('preview-container');
                    if (pdfPage && pc) {
                        const pageRect = pdfPage.getBoundingClientRect();
                        const pcRect = pc.getBoundingClientRect();
                        left = Math.max(pcRect.left + 6, pageRect.left - pw - 10);
                        // アンカー要素の縦位置に合わせる（画面内に収める）
                        top = Math.min(Math.max(rect.top, pcRect.top + 8), window.innerHeight - ph - 8);

                        // 図形編集パネルが表示中なら重ならないよう縦に並べる
                        if (_shapeEditorPanel && _shapeEditorPanel.isConnected) {
                            const sr = _shapeEditorPanel.getBoundingClientRect();
                            // 両パネルが重なる場合、テキストパネルを図形パネルの下に移動
                            if (top < sr.bottom + 6 && top + ph > sr.top - 6) {
                                top = sr.bottom + 8;
                                // 画面外にはみ出す場合は上に
                                if (top + ph > window.innerHeight - 8) {
                                    top = sr.top - ph - 8;
                                }
                            }
                        }
                    } else {
                        left = 8;
                        top = Math.min(rect.top, window.innerHeight - ph - 8);
                    }
                } else {
                    // モバイル: 従来通りアンカー要素の下に表示
                    top = rect.bottom + 8;
                    left = rect.left;
                    if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
                    if (left < 8) left = 8;
                    if (top + ph > window.innerHeight - 8) top = rect.top - ph - 8;
                }
                panel.style.left = left + 'px';
                panel.style.top = top + 'px';
            }

            function closeFloatingEditor() {
                const panel = document.getElementById('floating-style-editor');
                if (panel) panel.classList.remove('visible');
                _fseCurrentTarget = null;
            }

            // ====== モバイル編集ポップアップ ======
            let _mobilePopupCleanup = null;
            function showMobileEditPopup(anchorEl, onConfirm) {
                // 既存ポップアップを閉じる
                hideMobileEditPopup();

                let popup = document.getElementById('mobile-edit-popup');
                if (!popup) {
                    popup = document.createElement('div');
                    popup.id = 'mobile-edit-popup';
                    popup.innerHTML = '✎ 編集';
                    document.body.appendChild(popup);
                }

                // 位置計算: アンカー要素の上またはした
                const rect = anchorEl.getBoundingClientRect();
                popup.classList.add('visible');
                // レンダリング後に位置確定
                requestAnimationFrame(() => {
                    const pw = popup.offsetWidth || 90;
                    const ph = popup.offsetHeight || 40;
                    let top = rect.bottom + 6;
                    let left = rect.left + (rect.width - pw) / 2;
                    if (top + ph > window.innerHeight - 8) top = rect.top - ph - 6;
                    if (left < 8) left = 8;
                    if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
                    popup.style.top = top + 'px';
                    popup.style.left = left + 'px';
                });

                // 「編集」ボタンをタップ→編集パネルを開く
                function onPopupTap(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    hideMobileEditPopup();
                    onConfirm();
                }
                popup.addEventListener('touchstart', onPopupTap, { passive: false });
                popup.addEventListener('click', onPopupTap);

                // 外部タッチでポップアップを閉じる（少し遅延して登録）
                function onOutside(e) {
                    if (e.target !== popup && !popup.contains(e.target)) {
                        hideMobileEditPopup();
                    }
                }
                setTimeout(() => {
                    document.addEventListener('touchstart', onOutside, { passive: true });
                    document.addEventListener('mousedown', onOutside);
                }, 100);

                _mobilePopupCleanup = () => {
                    popup.removeEventListener('touchstart', onPopupTap);
                    popup.removeEventListener('click', onPopupTap);
                    document.removeEventListener('touchstart', onOutside);
                    document.removeEventListener('mousedown', onOutside);
                };
            }

            function hideMobileEditPopup() {
                const popup = document.getElementById('mobile-edit-popup');
                if (popup) popup.classList.remove('visible');
                if (_mobilePopupCleanup) { _mobilePopupCleanup(); _mobilePopupCleanup = null; }
            }

            // プレビュー内のクリックイベントをスコープ外で初期化
            function initPreviewClickEdit() {
                const pc = document.getElementById('preview-container');

                // 編集処理の共通ロジック
                function doOpenEditor(targetEl) {
                    const panelId = targetEl.dataset.clickableStyle;
                    let styleObj, label;
                    if (panelId === 'title') {
                        styleObj = state.titleStyle; label = 'タイトル';
                    } else if (panelId === 'date') {
                        styleObj = state.dateStyle; label = '日付';
                    } else if (panelId.startsWith('heading_')) {
                        const idx = parseInt(panelId.split('_')[1]);
                        styleObj = state.items[idx]?.headingStyle; label = `見出し${idx + 1}`;
                    } else if (panelId.startsWith('content_')) {
                        const idx = parseInt(panelId.split('_')[1]);
                        styleObj = state.items[idx]?.contentStyle; label = `本文${idx + 1}`;
                    }
                    if (!styleObj) return;
                    openFloatingEditor(panelId, label, styleObj, targetEl);
                }

                // PC: クリックで即座に編集パネルを開く
                pc.addEventListener('click', (e) => {
                    const target = e.target.closest('[data-clickable-style]');
                    if (!target) return;
                    e.stopPropagation();
                    doOpenEditor(target);
                });

                // モバイル: タッチで「編集」ポップアップを表示 → タップで編集パネルを開く
                pc.addEventListener('touchstart', (e) => {
                    const target = e.target.closest('[data-clickable-style]');
                    if (!target) return;
                    e.stopPropagation();
                    // ドラッグとの誤判定を防ぐため touchend で確定
                    const startX = e.touches[0].clientX;
                    const startY = e.touches[0].clientY;
                    function onTouchEnd(te) {
                        pc.removeEventListener('touchend', onTouchEnd);
                        const movedX = Math.abs(te.changedTouches[0].clientX - startX);
                        const movedY = Math.abs(te.changedTouches[0].clientY - startY);
                        if (movedX < 10 && movedY < 10) {
                            // タップ判定: ポップアップ表示
                            showMobileEditPopup(target, () => doOpenEditor(target));
                        }
                    }
                    pc.addEventListener('touchend', onTouchEnd, { once: true });
                }, { passive: true });
            }

            // ====== スタイルパネルHTML生成ヘルパー ======
            function buildStylePanelHTML(id, styleObj, opts = {}) {
                const { showFont = true, showAlign = false, label = 'テキストスタイル' } = opts;
                const sizeOptions = [
                    { v: 'xs', t: '極小' }, { v: 'sm', t: '小' }, { v: 'base', t: '標準' },
                    { v: 'lg', t: '大' }, { v: 'xl', t: '特大' }, { v: '2xl', t: '極大' }
                ];
                const weightOptions = [
                    { v: '300', t: '細' }, { v: '400', t: '普通' }, { v: '500', t: '中' },
                    { v: '700', t: '太' }, { v: '900', t: '極太' }
                ];

                const sizeBtns = sizeOptions.map(o =>
                    `<button class="style-btn${styleObj.size === o.v ? ' active' : ''}" data-panel="${id}" data-prop="size" data-val="${o.v}">${o.t}</button>`
                ).join('');
                const weightBtns = weightOptions.map(o =>
                    `<button class="style-btn${styleObj.weight === o.v ? ' active' : ''}" data-panel="${id}" data-prop="weight" data-val="${o.v}">${o.t}</button>`
                ).join('');
                const fontBtns = !showFont ? '' : Object.entries(FONT_LABEL).map(([v, t]) =>
                    `<button class="style-btn${styleObj.font === v ? ' active' : ''}" data-panel="${id}" data-prop="font" data-val="${v}">${t}</button>`
                ).join('');
                const alignBtns = !showAlign ? '' : ALIGN_BTNS.map(o =>
                    `<button class="style-btn${(styleObj.align || 'left') === o.v ? ' active' : ''}" data-panel="${id}" data-prop="align" data-val="${o.v}" title="${o.t}揃え">${o.icon}</button>`
                ).join('');

                return `<div class="style-panel" data-panel-id="${id}">
                    <div class="style-panel-toggle" data-panel-toggle="${id}">
                        <span class="toggle-arrow">▶</span>
                        <span>✦ ${label}</span>
                    </div>
                    <div class="style-panel-body" data-panel-body="${id}">
                        <div class="style-row">
                            <span class="style-label">色</span>
                            <input type="color" class="style-color-input" data-panel="${id}" data-prop="color" value="${styleObj.color}">
                            <span style="font-size:10px;color:#94a3b8;">${styleObj.color}</span>
                        </div>
                        <div class="style-row">
                            <span class="style-label">サイズ</span>
                            <div class="style-btn-group">${sizeBtns}</div>
                        </div>
                        <div class="style-row">
                            <span class="style-label">太さ</span>
                            <div class="style-btn-group">${weightBtns}</div>
                        </div>
                        ${showFont ? `<div class="style-row"><span class="style-label">書体</span><div class="style-btn-group">${fontBtns}</div></div>` : ''}
                        ${showAlign ? `<div class="style-row"><span class="style-label">揃え</span><div class="style-btn-group">${alignBtns}</div></div>` : ''}
                    </div>
                </div>`;
            }

            // ====== スタイルパネルのイベント委任 ======
            function attachStylePanelEvents(container) {
                container.querySelectorAll('[data-panel-toggle]').forEach(toggle => {
                    toggle.addEventListener('click', () => {
                        const id = toggle.dataset.panelToggle;
                        const body = container.querySelector(`[data-panel-body="${id}"]`);
                        if (body) {
                            body.classList.toggle('open');
                            toggle.classList.toggle('open');
                        }
                    });
                });
                container.querySelectorAll('.style-btn[data-panel]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const { panel, prop, val } = btn.dataset;
                        applyStyleChange(panel, prop, val);
                    });
                });
                container.querySelectorAll('.style-color-input[data-panel]').forEach(input => {
                    input.addEventListener('input', () => {
                        const { panel, prop } = input.dataset;
                        // 隣のspan更新
                        const span = input.nextElementSibling;
                        if (span) span.textContent = input.value;
                        applyStyleChange(panel, prop, input.value);
                    });
                });
            }

            // ====== スタイル変更の適用 ======
            function applyStyleChange(panelId, prop, val) {
                if (panelId === 'title') {
                    state.titleStyle[prop] = val;
                } else if (panelId === 'date') {
                    state.dateStyle[prop] = val;
                } else if (panelId.startsWith('heading_')) {
                    const idx = parseInt(panelId.split('_')[1]);
                    if (state.items[idx]) state.items[idx].headingStyle[prop] = val;
                } else if (panelId.startsWith('content_')) {
                    const idx = parseInt(panelId.split('_')[1]);
                    if (state.items[idx]) state.items[idx].contentStyle[prop] = val;
                }
                // アクティブボタンを更新
                document.querySelectorAll(`[data-panel="${panelId}"][data-prop="${prop}"]`).forEach(el => {
                    if (el.tagName === 'BUTTON') {
                        el.classList.toggle('active', el.dataset.val === val);
                    }
                });
                updatePreview();
            }

            // ====== タイトル・日付スタイルパネルを描画 ======
            function renderStylePanels() {
                const tp = document.getElementById('title-style-panel');
                if (tp) {
                    tp.innerHTML = buildStylePanelHTML('title', state.titleStyle, { label: 'タイトルスタイル', showAlign: true });
                    attachStylePanelEvents(tp);
                }
                const dp = document.getElementById('date-style-panel');
                if (dp) {
                    dp.innerHTML = buildStylePanelHTML('date', state.dateStyle, { label: '日付スタイル', showFont: false, showAlign: false });
                    attachStylePanelEvents(dp);
                }
            }

            function renderItemsForm() {
                const c = document.getElementById('items-container');
                c.innerHTML = '';
                state.items.forEach((item, i) => {
                    if (!item.headingStyle) item.headingStyle = { ...DEFAULT_HEADING_STYLE };
