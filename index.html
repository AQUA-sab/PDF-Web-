                    const row = document.createElement('div');
                    row.className = 'bg-slate-50 border border-slate-100 p-3 rounded-lg flex flex-col gap-2 relative group';

                    const headingPanelHTML = buildStylePanelHTML(`heading_${i}`, item.headingStyle, { label: '見出しスタイル', showAlign: false });
                    const contentPanelHTML = buildStylePanelHTML(`content_${i}`, item.contentStyle, { label: '本文スタイル', showFont: false, showAlign: false });

                    row.innerHTML = `
                        <div class="flex items-center gap-2">
                            <input type="text" placeholder="見出し (例: 進捗報告)" value="${item.heading.replace(/"/g, '&quot;')}" class="item-field flex-1 p-2 bg-white border border-slate-200 rounded font-bold" data-idx="${i}" data-key="heading">
                            <button class="btn-del-item flex-shrink-0 w-8 h-8 flex items-center justify-center text-slate-300 hover:text-red-500 hover:bg-red-50 rounded transition-colors" data-idx="${i}" title="削除"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        </div>
                        ${headingPanelHTML}
                        <textarea placeholder="内容（任意）" class="item-field w-full p-2 bg-white border border-slate-200 rounded leading-relaxed resize-none h-16" data-idx="${i}" data-key="content">${item.content}</textarea>
                        ${contentPanelHTML}
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-[10px] text-slate-500 font-bold">メモ欄の行数:</span>
                            <button class="btn-memo-dec w-7 h-7 flex items-center justify-center text-slate-500 hover:text-white hover:bg-blue-500 bg-slate-100 rounded font-black text-sm transition-all select-none" data-idx="${i}" type="button">−</button>
                            <input type="number" min="0" max="20" value="${item.memoLines}" class="item-field w-12 p-1 text-center border border-slate-200 rounded" data-idx="${i}" data-key="memoLines">
                            <button class="btn-memo-inc w-7 h-7 flex items-center justify-center text-slate-500 hover:text-white hover:bg-blue-500 bg-slate-100 rounded font-black text-sm transition-all select-none" data-idx="${i}" type="button">＋</button>
                        </div>`;
                    c.appendChild(row);
                    attachStylePanelEvents(row);
                });

                c.querySelectorAll('.item-field').forEach(el => {
                    el.addEventListener('input', e => {
                        let val = e.target.value;
                        if (e.target.dataset.key === 'memoLines') val = parseInt(val) || 0;
                        state.items[+e.target.dataset.idx][e.target.dataset.key] = val;
                        updatePreview();
                    });
                });
                // メモ行数 +/- ボタン
                function changeMemoLines(idx, delta) {
                    const item = state.items[idx];
                    if (!item) return;
                    item.memoLines = Math.max(0, Math.min(20, (item.memoLines || 0) + delta));
                    // 入力欄も同期
                    const input = c.querySelector(`input[data-idx="${idx}"][data-key="memoLines"]`);
                    if (input) input.value = item.memoLines;
                    updatePreview();
                }
                c.querySelectorAll('.btn-memo-dec').forEach(btn => {
                    btn.addEventListener('click', () => changeMemoLines(+btn.dataset.idx, -1));
                    btn.addEventListener('touchstart', (e) => { e.preventDefault(); changeMemoLines(+btn.dataset.idx, -1); }, { passive: false });
                });
                c.querySelectorAll('.btn-memo-inc').forEach(btn => {
                    btn.addEventListener('click', () => changeMemoLines(+btn.dataset.idx, 1));
                    btn.addEventListener('touchstart', (e) => { e.preventDefault(); changeMemoLines(+btn.dataset.idx, 1); }, { passive: false });
                });
                c.querySelectorAll('.btn-del-item').forEach(el => {
                    el.addEventListener('click', e => { state.items.splice(+e.currentTarget.dataset.idx, 1); renderItemsForm(); updatePreview(); });
                });
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }

            function syncFormInputs() {
                Object.keys(state).forEach(k => {
                    if (k === 'items' || k === 'images') return;
                    const el = document.querySelector(`[data-field="${k}"]`);
                    if (el) el.value = state[k];
                });
                document.querySelectorAll('textarea.field-input').forEach(ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
                document.getElementById('chk-memo-page').checked = state.includeMemoPage;
            }

            function updatePreviewField(field) { document.querySelectorAll(`[data-view="${field}"]`).forEach(el => el.innerText = state[field]); }

            function applyStyleToEl(el, styleObj) {
                if (!el || !styleObj) return;
                el.style.color = styleObj.color || '';
                el.style.fontSize = SIZE_MAP[styleObj.size] || '';
                el.style.fontWeight = styleObj.weight || '';
                el.style.fontFamily = FONT_MAP[styleObj.font] || '';
                el.style.textAlign = styleObj.align || '';
            }

            function updatePreview() {
                Object.keys(state).forEach(k => { if (k !== 'items' && k !== 'images' && k !== 'titleStyle' && k !== 'dateStyle') updatePreviewField(k); });

                // タイトル・日付スタイル反映
                document.querySelectorAll('[data-view="title"]').forEach(el => applyStyleToEl(el, state.titleStyle));
                document.querySelectorAll('[data-view="date"]').forEach(el => applyStyleToEl(el, state.dateStyle));

                const flowArea = document.querySelector('[data-flow-area]');
                if (flowArea) {
                    flowArea.innerHTML = '';
                    state.items.forEach((item, i) => {
                        if (!item.headingStyle) item.headingStyle = { ...DEFAULT_HEADING_STYLE };
                        if (!item.contentStyle) item.contentStyle = { ...DEFAULT_CONTENT_STYLE };

                        const block = document.createElement('div');
                        block.className = 'flow-block';
                        const memoHtml = item.memoLines > 0 ? `
                            <div class="mt-4 flex flex-col gap-0 border-t border-slate-300">
                                ${Array(item.memoLines).fill('<div class="h-8 border-b border-slate-300 border-dashed"></div>').join('')}
                            </div>` : '';

                        const hs = item.headingStyle;
                        const cs = item.contentStyle;
                        const headingInlineStyle = `color:${hs.color};font-size:${SIZE_MAP[hs.size]};font-weight:${hs.weight};font-family:${FONT_MAP[hs.font]};text-align:${hs.align || 'left'};border-left-color:${hs.color};`;
                        const contentInlineStyle = cs ? `color:${cs.color};font-size:${SIZE_MAP[cs.size]};font-weight:${cs.weight};font-family:${FONT_MAP[cs.font]};text-align:${cs.align || 'left'};` : '';;

                        block.innerHTML = `
                            <div class="density-pad">
                                <h2 class="border-l-[3px] pl-3 mb-3 flex items-center gap-2" style="${headingInlineStyle}" data-clickable-style="heading_${i}">
                                    <span class="text-white w-5 h-5 rounded-full flex items-center justify-center text-[10px] shrink-0" style="background:${hs.color};">${i + 1}</span>
                                    ${item.heading || '未入力'}
                                </h2>
                                ${item.content ? `<div class="leading-[1.8] whitespace-pre-wrap pl-5" style="${contentInlineStyle}" data-clickable-style="content_${i}">${item.content}</div>` : ''}
                                ${memoHtml}
                            </div>`;
                        flowArea.appendChild(block);
                    });

                    // 汎用メモページはautoPaginate()後に独立したページとして追加するため、ここでは追加しない
                }

                autoPaginate();
                addMemoPageIfNeeded();
                renderImages();
                renderShapes();
                autoAdjustDensity();
            }

            function autoPaginate() {
                const wrapper = document.querySelector('.preview-wrapper');
                if (!wrapper) return;
                document.querySelectorAll('.pdf-page[data-dynamic]').forEach(p => p.closest('.capture-area-container')?.remove());

                const firstFlowArea = document.querySelector('[data-flow-area]');
                if (!firstFlowArea) return;

                const blocks = Array.from(firstFlowArea.querySelectorAll('.flow-block'));
                if (!blocks.length) return;

                blocks.forEach(b => b.remove());

                const pageH = currentPageSize.h;
                const PADDING_V = 100, FOOTER_H = 40, SAFETY = 15;
                let headerH = 0;
                let _el = firstFlowArea.previousElementSibling;
                while (_el) { headerH += _el.offsetHeight + parseFloat(getComputedStyle(_el).marginBottom || 0); _el = _el.previousElementSibling; }
                const LIMIT_FIRST = pageH - PADDING_V - FOOTER_H - SAFETY - headerH;
                const LIMIT_NORMAL = pageH - PADDING_V - FOOTER_H - SAFETY;

                let currentFlowArea = firstFlowArea;
                let currentH = 0, limit = LIMIT_FIRST, pageCount = 1;

                blocks.forEach(block => {
                    currentFlowArea.appendChild(block);
                    const blockH = block.offsetHeight + 24;

                    if (currentH + blockH > limit && currentH > 0) {
                        block.remove();
                        pageCount++;
                        const newContainer = document.createElement('div'); newContainer.className = 'capture-area-container'; newContainer.style.position = 'relative';
                        const newPage = document.createElement('div'); newPage.className = 'pdf-page relative'; newPage.setAttribute('data-page', String(pageCount - 1)); newPage.setAttribute('data-dynamic', 'true');
                        const imgLayer = document.createElement('div'); imgLayer.className = 'img-layer absolute inset-0 z-40 pointer-events-none';
                        newPage.appendChild(imgLayer);
                        const newInner = document.createElement('div'); newInner.className = 'page-inner flex flex-col h-full p-[50px]';
                        const newFlowArea = document.createElement('div'); newFlowArea.className = 'flex-grow flex flex-col gap-6 pt-4 density-gap'; newFlowArea.style.justifyContent = 'flex-start'; newFlowArea.setAttribute('data-flow-area', '');
                        newInner.appendChild(newFlowArea);
                        newPage.appendChild(newInner);
                        newContainer.appendChild(newPage);
                        wrapper.appendChild(newContainer);

                        currentFlowArea = newFlowArea;
                        currentFlowArea.appendChild(block);
                        currentH = block.offsetHeight + 24;
                        limit = LIMIT_NORMAL;
                    } else {
                        currentH += blockH;
                    }
                });

                const allFlowAreas = document.querySelectorAll('[data-flow-area]');
                if (allFlowAreas.length >= 2) {
                    const lastArea = allFlowAreas[allFlowAreas.length - 1];
                    const prevArea = allFlowAreas[allFlowAreas.length - 2];
                    const prevPage = prevArea.closest('.pdf-page');
                    const prevInner = prevPage.querySelector('.page-inner');
                    prevInner.style.height = 'auto';
                    const remainingH = (prevPage.clientHeight - 160) - prevInner.scrollHeight;
                    prevInner.style.height = '';
                    lastArea.style.height = 'auto';
                    const lastH = lastArea.scrollHeight;
                    lastArea.style.height = '';
                    if (lastH <= remainingH) {
                        Array.from(lastArea.querySelectorAll('.flow-block')).forEach(b => prevArea.appendChild(b));
                        lastArea.closest('.pdf-page').closest('.capture-area-container')?.remove();
                        pageCount--;
                    }
                }
                updateZoomUI();
            }

            // ====== 汎用メモページを常に最後の独立ページとして追加 ======
            function addMemoPageIfNeeded() {
                // 既存のメモページを削除
                document.querySelectorAll('.memo-only-page').forEach(p => {
                    p.closest('.capture-area-container')?.remove();
                });
                if (!state.includeMemoPage) return;

                const wrapper = document.querySelector('.preview-wrapper');
                if (!wrapper) return;

                // 現在の全ページ数を取得して新ページの番号を決定
                const existingPages = document.querySelectorAll('.pdf-page');
                const newPageIndex = existingPages.length;

                const newContainer = document.createElement('div');
                newContainer.className = 'capture-area-container';
                newContainer.style.position = 'relative';

                const newPage = document.createElement('div');
                newPage.className = 'pdf-page relative memo-only-page';
                newPage.setAttribute('data-page', String(newPageIndex));
                newPage.setAttribute('data-dynamic', 'true');

                const imgLayer = document.createElement('div');
                imgLayer.className = 'img-layer absolute inset-0 z-40 pointer-events-none';
                newPage.appendChild(imgLayer);

                const newInner = document.createElement('div');
                newInner.className = 'page-inner flex flex-col h-full p-[50px]';
                newInner.innerHTML = `
                    <div class="pt-4">
                        <h2 class="text-lg font-bold mb-4 border-l-4 border-slate-300 pl-3 uppercase tracking-widest text-slate-400">Memo</h2>
                        <div class="flex flex-col gap-0 border-t border-slate-400">
                            ${Array(28).fill('<div class="h-[34px] border-b border-slate-300"></div>').join('')}
                        </div>
                    </div>`;
                newPage.appendChild(newInner);
                newContainer.appendChild(newPage);
                wrapper.appendChild(newContainer);

                updateZoomUI();
            }

            function autoAdjustDensity() {
                document.querySelectorAll('.pdf-page').forEach(page => {
                    const inner = page.querySelector('.page-inner');
                    if (!inner) return;
                    const safeH = page.clientHeight - 60;
                    inner.style.height = 'auto'; inner.style.transform = ''; inner.style.width = ''; inner.style.marginLeft = '';
                    inner.style.fontSize = ''; inner.style.lineHeight = '';
                    inner.querySelectorAll('.density-gap').forEach(el => el.style.gap = '');
                    inner.querySelectorAll('.density-pad').forEach(el => el.style.padding = '');
                    inner.querySelectorAll(':scope > *').forEach(el => el.style.marginBottom = '');

                    let scale = 1.0;
                    while (inner.scrollHeight > safeH && scale > 0.75) {
                        scale -= 0.02;
                        inner.style.fontSize = `${scale}em`;
                        inner.style.lineHeight = `${Math.max(1.2, 1.6 * scale)}`;
                        inner.querySelectorAll('.density-gap').forEach(el => { el.style.gap = `${Math.max(8, parseFloat(getComputedStyle(el).gap) * scale)}px`; });
                        inner.querySelectorAll('.density-pad').forEach(el => { el.style.padding = `${Math.max(8, parseFloat(getComputedStyle(el).padding) * scale)}px`; });
                    }
                    if (inner.scrollHeight > safeH) {
                        const finalScale = safeH / inner.scrollHeight;
                        inner.style.transform = `scale(${finalScale})`; inner.style.transformOrigin = 'top center';
                        inner.style.width = `${100 / finalScale}%`; inner.style.marginLeft = `${(100 - 100 / finalScale) / 2}%`;
                    }
                    inner.style.height = '';
                });
            }
            document.fonts.ready.then(() => autoAdjustDensity());
            window.addEventListener('resize', () => autoAdjustDensity());

            function updateZoomUI() {
                const pages = document.querySelectorAll('.pdf-page');
                const containers = document.querySelectorAll('.capture-area-container');
                const pw = currentPageSize.w, ph = currentPageSize.h;
                pages.forEach(el => el.style.transform = `scale(${currentScale})`);
                containers.forEach(c => { c.style.width = `${pw * currentScale}px`; c.style.height = `${ph * currentScale}px`; });
                document.getElementById('zoom-level-text').innerText = `${Math.round(currentScale * 100)}%`;
            }

            function adjustZoom(newScale) {
                const pc = document.getElementById('preview-container');
                const pw = currentPageSize.w, ph = currentPageSize.h;
                if (!pc) { currentScale = newScale; updateZoomUI(); return; }
                const totalH = ph * document.querySelectorAll('.pdf-page').length;
                const cx = (pc.scrollLeft + pc.clientWidth / 2) / (pw * currentScale);
                const cy = (pc.scrollTop + pc.clientHeight / 2) / (totalH * currentScale);
                currentScale = newScale; updateZoomUI();
                pc.scrollLeft = cx * pw * currentScale - pc.clientWidth / 2;
                pc.scrollTop = cy * totalH * currentScale - pc.clientHeight / 2;
            }

            function fitToScreen() {
                const c = document.getElementById('preview-container');
                if (!c) return;
                currentScale = Math.max(0.1, Math.min((c.clientWidth - 20) / currentPageSize.w, (c.clientHeight - 40) / currentPageSize.h, 1.0));
                updateZoomUI();
            }

            function generateCleanSource() {
                const dc = document.documentElement.cloneNode(true);
                dc.querySelectorAll('script').forEach(s => { const src = s.getAttribute('src') || '', id = s.getAttribute('id'); if (!(src.includes('tailwindcss.com') || src.includes('lucide') || src.includes('jspdf') || src.includes('html-to-image')) && id !== 'main-script') s.remove(); });
                dc.querySelectorAll('style').forEach(s => { const t = s.textContent || ''; if (t.includes('.pdf-page') || t.includes('.preview-wrapper') || t.includes('.floating-zoom') || t.includes('.pdf-overlay') || t.includes('.draggable-image-wrapper') || t.includes('--page-w')) return; if (t.includes('--tw-') || t.includes('interaction') || t.includes('::backdrop')) s.remove(); });
                dc.removeAttribute('style'); const body = dc.querySelector('body'); if (body) { body.removeAttribute('style'); body.classList.remove('is-capturing'); }
                dc.querySelectorAll('.pdf-page[data-dynamic]').forEach(p => p.closest('.capture-area-container')?.remove());
                const db = dc.querySelector('#downloadBtnText'); if (db) db.innerText = 'PDF保存';
                const bd = dc.querySelector('#btn-download'); if (bd) bd.disabled = false;
                const n = dc.querySelector('#notification'); if (n) n.classList.add('hidden');
                const ov = dc.querySelector('#pdf-overlay'); if (ov) ov.classList.remove('active');
                dc.querySelectorAll('.img-layer').forEach(layer => layer.innerHTML = '');
                dc.querySelectorAll('.shape-layer').forEach(layer => layer.innerHTML = '');
                dc.querySelectorAll('.shape-editor-panel').forEach(p => p.remove());
                dc.querySelectorAll('svg[data-lucide]').forEach(svg => {
                    const i = document.createElement('i'); i.setAttribute('data-lucide', svg.getAttribute('data-lucide'));
                    const cls = svg.getAttribute('class'); if (cls) i.setAttribute('class', cls.replace(/lucide\s*lucide-[\w-]+\s*/g, '').trim());
                    svg.replaceWith(i);
                });
                dc.querySelectorAll('.pdf-page, .page-inner, .capture-area-container, [data-flow-area], .density-pad, .density-gap').forEach(el => el.removeAttribute('style'));
                const ic = dc.querySelector('#items-container'); if (ic) ic.innerHTML = '';
                dc.querySelectorAll('[data-flow-area]').forEach(fa => fa.innerHTML = '');
                let src = "<!DOCTYPE html>\n" + dc.outerHTML;
                src = src.replace(/\/\* __INJECTED_DATA_START__ \*\/[\s\S]*?\/\* __INJECTED_DATA_END__ \*\//, `/* __INJECTED_DATA_START__ */ const __EMBEDDED_DATA__ = ${JSON.stringify(state)}; /* __INJECTED_DATA_END__ */`);
                return src;
            }

            function handleOpenNewTab() {
                const src = generateCleanSource();
                const blobUrl = URL.createObjectURL(new Blob([src], { type: 'text/html' }));
                const newTab = window.open(blobUrl, '_blank');
                if (!newTab || newTab.closed || typeof newTab.closed === 'undefined') { URL.revokeObjectURL(blobUrl); return; }
                setTimeout(() => URL.revokeObjectURL(blobUrl), 3000);
                showNotification('別タブで開きました', 'success');
            }

            async function handleCopyCode() {
                const s = generateCleanSource();
                try {
                    await navigator.clipboard.writeText(s);
                    showNotification('クリーンなコードをコピーしました！', 'success');
                } catch (e) {
                    try {
                        const t = document.createElement("textarea"); t.value = s; t.style.cssText = "position:fixed;left:-9999px"; document.body.appendChild(t); t.select(); document.execCommand("copy"); document.body.removeChild(t);
                        showNotification('コードをコピーしました', 'success');
                    } catch (e2) { showNotification('コピーに失敗しました', 'error'); }
                }
            }

            function handleClearForm() {
                if (!confirm('入力した内容と挿入された画像・図形をすべて消去します。よろしいですか？')) return;
                state.title = '';
                state.date = '';
                state.items = [];
                state.images = [];
                state.shapes = [];
                state.includeMemoPage = false;
                state.titleStyle = { ...DEFAULT_TITLE_STYLE };
                state.dateStyle = { ...DEFAULT_DATE_STYLE };
                syncFormInputs();
                renderItemsForm();
                updatePreview();
                renderStylePanels();
                showNotification('フォームをクリアしました', 'success');
            }

            async function handleDownloadPDF() {
                const btn = document.getElementById('btn-download'), txt = document.getElementById('downloadBtnText');
                const overlay = document.getElementById('pdf-overlay');
                if (btn.disabled) return;
                btn.disabled = true; txt.innerText = '生成中...';
                document.body.classList.add('is-capturing');
                document.querySelectorAll('.draggable-image-wrapper').forEach(el => el.classList.remove('active'));
                overlay.classList.add('active');
                document.getElementById('preview-container').style.overflow = 'hidden';

                try {
                    await document.fonts.ready;
                    const pages = document.querySelectorAll('.pdf-page');
                    const pw = currentPageSize.w, ph = currentPageSize.h;
                    const orient = currentPageSize.orient || 'p';
                    const pdf = new jspdf.jsPDF({ orientation: orient, unit: 'mm', format: currentPageSize.pdf });
                    const mmW = currentPageSize.mmW, mmH = currentPageSize.mmH;

                    for (let i = 0; i < pages.length; i++) {
                        if (i > 0) pdf.addPage();
                        let canvas;
                        try { canvas = await htmlToImage.toCanvas(pages[i], { pixelRatio: 3, quality: 0.95, backgroundColor: '#ffffff', width: pw, height: ph, skipFonts: false, preferredFontFormat: 'woff2', style: { transform: 'none', boxShadow: 'none' } }); }
                        catch (ce) { throw new Error(`ページ${i + 1}の画像キャプチャに失敗しました。`); }
                        const imgData = canvas.toDataURL('image/jpeg', 0.9);
                        pdf.addImage(imgData, 'JPEG', 0, 0, mmW, mmH, undefined, 'FAST');
                    }
                    const cs = generateCleanSource();
                    const enc = safeBase64Encode(JSON.stringify({ data: state, sourceCode: cs, appId: APP_ID }));
                    const blob = new Blob([pdf.output('arraybuffer'), new TextEncoder().encode(`\n[START_FULL_DATA]${enc}[END_FULL_DATA]\n`)], { type: 'application/pdf' });
                    const link = document.createElement('a'); link.href = URL.createObjectURL(blob);
                    link.download = `アジェンダ_${state.date.replace(/[\/\s]/g, '')}.pdf`;
                    link.click(); URL.revokeObjectURL(link.href);
                    showNotification('PDFを保存しました', 'success');
                } catch (err) {
                    console.error(err); showNotification(err.message || 'エラーが発生しました', 'error');
                } finally {
                    document.body.classList.remove('is-capturing');
                    overlay.classList.remove('active');
                    document.getElementById('preview-container').style.overflow = '';
                    btn.disabled = false; txt.innerText = 'PDF保存';
                }
            }

            async function handleFileUpload(e) {
                const file = e.target.files[0]; if (!file) return;
                e.target.value = '';
                const sM = '[START_FULL_DATA]', eM = '[END_FULL_DATA]';

                try {
                    // ── Step1: 末尾512バイトで [END_FULL_DATA] の存在だけ確認 ──
                    const STEP1 = 512;
                    const s1Offset = Math.max(0, file.size - STEP1);
                    const s1Text = new TextDecoder('utf-8', { fatal: false }).decode(
                        new Uint8Array(await file.slice(s1Offset).arrayBuffer()));

                    if (!s1Text.includes(eM)) {
                        showNotification('このPDFにはアプリの保存データが含まれていません', 'error');
                        return;
                    }

                    // ── Step2: 末尾最大20MBを読んでフルデータを取得 ──
                    const MAX_DATA = 20 * 1024 * 1024;
                    const s2Offset = Math.max(0, file.size - MAX_DATA);
                    const s2Text = new TextDecoder('utf-8', { fatal: false }).decode(
                        new Uint8Array(await file.slice(s2Offset).arrayBuffer()));

                    const si = s2Text.lastIndexOf(sM), ei = s2Text.lastIndexOf(eM);
                    if (si === -1 || ei === -1 || si >= ei) {
                        showNotification('保存データの読み込みに失敗しました', 'error');
                        return;
                    }

                    const payload = JSON.parse(safeBase64Decode(s2Text.substring(si + sM.length, ei)));

                    // ── 現在タブに必ずデータを反映（sourceCode有無に関わらず） ──
                    if (payload.data) {
                        state = { ...state, ...payload.data };
                        // スタイルの欠損補完（旧データ互換）
                        if (!state.titleStyle) state.titleStyle = { ...DEFAULT_TITLE_STYLE };
                        if (!state.dateStyle) state.dateStyle = { ...DEFAULT_DATE_STYLE };
                        state.items.forEach(item => {
                            if (!item.headingStyle) item.headingStyle = { ...DEFAULT_HEADING_STYLE };
                            if (!item.contentStyle) item.contentStyle = { ...DEFAULT_CONTENT_STYLE };
                        });
                        syncFormInputs();
                        renderItemsForm();
                        updatePreview();
                        renderStylePanels();
                    }

                    showNotification('データを復元しました', 'success');

                } catch (err) { console.error('Restore error:', err); showNotification('読み込みエラー: ' + err.message, 'error'); }
            }

            function showNotification(msg, type = 'success') {
                const el = document.getElementById('notification'), icon = document.getElementById('notification-icon');
                document.getElementById('notification-message').innerText = msg;
                el.classList.remove('hidden', 'bg-red-600', 'bg-slate-900');
                el.classList.add(type === 'error' ? 'bg-red-600' : 'bg-slate-900');
                if (icon) {
                    icon.setAttribute('data-lucide', type === 'error' ? 'alert-triangle' : 'check-circle');
                    icon.setAttribute('class', `w-5 h-5 ${type === 'error' ? 'text-red-300' : 'text-green-400'}`);
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }
                el.classList.remove('hidden');
                setTimeout(() => el.classList.add('hidden'), 4000);
            }

            init();
        })();
    </script>
